name: Build and Test

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Build Environment
        uses: ./.github/actions/setup

      - name: Build and run Android host tests
        run: ./gradlew testAndroidHostTest --continue --console=plain --no-daemon

  ios-test:
    name: iOS unit tests
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Build Environment
        uses: ./.github/actions/setup

      - name: Build and run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --continue --console=plain --no-daemon
