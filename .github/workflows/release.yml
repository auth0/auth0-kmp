name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish Release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: macos-latest
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Build Environment
        uses: ./.github/actions/setup

      # Get the version from the .version file
      - id: get_version
        uses: ./.github/actions/get-version

      # Get the prerelease flag from the version
      - id: get_prerelease
        uses: ./.github/actions/get-prerelease
        with:
          version: ${{ steps.get_version.outputs.version }}

      # Get the release notes from the merged PR body
      - id: get_release_notes
        uses: ./.github/actions/get-release-notes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.get_version.outputs.version }}
          repo_owner: ${{ github.repository_owner }}
          repo_name: ${{ github.event.repository.name }}

      # Check if the tag already exists
      - id: tag_exists
        uses: ./.github/actions/tag-exists
        with:
          tag: ${{ steps.get_version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # If the tag already exists, exit with an error
      - if: steps.tag_exists.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          echo "Tag '$VERSION' already exists. Skipping release."
          exit 1

      # Publish the release to Maven Central
      - uses: ./.github/actions/maven-publish
        with:
          ossr-username: ${{ secrets.OSSR_USERNAME }}
          ossr-token: ${{ secrets.OSSR_TOKEN }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}

      # Create the GitHub release
      - uses: ./.github/actions/release-create
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_release_notes.outputs.release-notes }}
          tag: ${{ steps.get_version.outputs.version }}
          commit: ${{ github.sha }}
          prerelease: ${{ steps.get_prerelease.outputs.prerelease }}

      - name: Announce release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          echo "🎉 Successfully released v$VERSION"
          echo "📦 Published to Maven Central"
          echo "🏷️  Tagged as v$VERSION"
          echo "📝 GitHub Release created"
